spring:
  application:
    name: cold-monitor-backend
  config:
    # local secrets such as the Telegram bot token; the file is git-ignored
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:coldmonitor}
    username: ${DB_USER:coldmonitor}
    password: ${DB_PASSWORD:coldmonitor}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  session:
    # the session tables are created by Flyway (V5)
    jdbc:
      initialize-schema: never

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      # an open dashboard keeps its session alive through the live stream, which reconnects every 30 minutes
      timeout: ${SESSION_TIMEOUT:12h}
      cookie:
        same-site: lax

cold-monitor:
  security:
    admin-username: ${ADMIN_USERNAME:admin}
    admin-password: ${ADMIN_PASSWORD:}
    # optional read-only account; it exists only while VIEWER_PASSWORD is set
    viewer-username: ${VIEWER_USERNAME:viewer}
    viewer-password: ${VIEWER_PASSWORD:}
    device-api-key: ${DEVICE_API_KEY:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  alerts:
    recovery-readings: ${ALERT_RECOVERY_READINGS:2}
    offline-after: ${ALERT_OFFLINE_AFTER:5m}
    offline-check-interval: ${ALERT_OFFLINE_CHECK_INTERVAL:15s}
    time-zone: ${ALERT_TIME_ZONE:America/Sao_Paulo}
    telegram:
      bot-token: ${TELEGRAM_BOT_TOKEN:}
      chat-id: ${TELEGRAM_CHAT_ID:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
