spring:
  application:
    name: cold-monitor-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:coldmonitor}
    username: ${DB_USER:coldmonitor}
    password: ${DB_PASSWORD:coldmonitor}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

cold-monitor:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
